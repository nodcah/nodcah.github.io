<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Interval Timer">
  <meta name="theme-color" content="#2196F3">
  <title>Interval Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="timer.css">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>Interval Timer</h1>
      <div class="header-actions">
        <button id="history-btn" class="icon-btn" aria-label="History">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Panel (floating dropdown) -->
    <div id="settings-panel" class="floating-panel hidden" data-panel="settings">
      <h2>Settings</h2>
      
      <div class="setting-item">
        <label>
          <input type="checkbox" id="sound-enabled" checked>
          <span>Sound Notifications</span>
        </label>
      </div>

      <div class="setting-item">
        <label>
          <input type="checkbox" id="vibration-enabled" checked>
          <span>Vibration</span>
        </label>
      </div>

      <div class="setting-item">
        <label>
          <input type="checkbox" id="halfway-alert" checked>
          <span>3 Second Warning</span>
        </label>
      </div>

      <div class="setting-item">
        <label>
          <input type="checkbox" id="background-notifications" checked>
          <span>Background Notifications</span>
        </label>
        <small>Get alerts even when phone is locked</small>
      </div>

      <button id="request-permission-btn" class="btn-secondary">Request Notification Permission</button>
    </div>

    <!-- History Panel (floating dropdown) -->
    <div id="history-panel" class="floating-panel hidden" data-panel="history">
      <h2>Workout History</h2>
      <div id="history-list" class="history-list">
        <p class="empty-state">No workouts yet. Start your first workout!</p>
      </div>
      <button id="clear-history-btn" class="btn-secondary">Clear History</button>
    </div>

    <!-- Main Timer Display -->
    <div class="timer-display">
      <div id="timer-time" class="timer-time">00:00</div>
      <div id="timer-label" class="timer-label">Ready</div>
      <div id="round-info" class="round-info"></div>
    </div>

    <!-- Control Buttons -->
    <div class="controls">
      <button id="start-pause-btn" class="btn-primary">Start</button>
      <button id="reset-btn" class="btn-secondary">Reset</button>
    </div>

    <!-- Interval Configuration -->
    <div class="config-section">
      <h2>Workout Setup</h2>
      
      <div class="config-item">
        <label>Workout Time</label>
        <div class="ruler-slider-container">
          <div class="ruler-slider" id="workout-time-ruler" data-type="workout">
            <div class="ruler-track"></div>
            <div class="ruler-indicator"></div>
          </div>
          <span id="workout-time-display" class="value-display">1m</span>
        </div>
      </div>

      <div class="config-item">
        <label>Rest Time</label>
        <div class="ruler-slider-container">
          <div class="ruler-slider" id="rest-time-ruler" data-type="rest">
            <div class="ruler-track"></div>
            <div class="ruler-indicator"></div>
          </div>
          <span id="rest-time-display" class="value-display">1m</span>
        </div>
      </div>

      <div class="config-item">
        <label>Number of Rounds</label>
        <div class="ruler-slider-container">
          <div class="ruler-slider" id="rounds-ruler" data-type="rounds">
            <div class="ruler-track"></div>
            <div class="ruler-indicator"></div>
          </div>
          <span id="rounds-display" class="value-display">10</span>
        </div>
      </div>

      <div class="config-item">
        <label>Workout Name (optional)</label>
        <input type="text" id="workout-name" placeholder="e.g., Tabata, HIIT, Custom" maxlength="30">
      </div>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
